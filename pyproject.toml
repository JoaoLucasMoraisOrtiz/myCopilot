[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codingos"
version = "0.1.0"
description = "codingOS: MCP supervisor + context scout + ACE memory"
requires-python = ">=3.10"
dependencies = [
  "mcp",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
